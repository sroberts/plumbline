name: coverage-ratchet

# Weekly: if total coverage on main exceeds the current floor by ≥3
# percentage points, open a PR bumping the floor by 1pp. One-way
# ratchet — the floor only ever goes up.
on:
  schedule:
    - cron: '0 8 * * 1' # Mondays 08:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  # For the fallback below: when the repo forbids Actions from opening
  # PRs, the ratchet files an issue instead so the result is still
  # visible. Without this the loop just dies in a log nobody reads.
  issues: write

jobs:
  ratchet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: measure coverage
        id: cov
        run: |
          go test -coverprofile=coverage.txt -covermode=atomic ./...
          total=$(go tool cover -func=coverage.txt | awk '/^total:/ {gsub("%",""); print $3}')
          floor=$(cat .coverage-floor 2>/dev/null || echo 60)
          echo "total=${total}" >> "$GITHUB_OUTPUT"
          echo "floor=${floor}" >> "$GITHUB_OUTPUT"
          echo "Total: ${total}%, Floor: ${floor}%"

      - name: decide
        id: decide
        run: |
          total='${{ steps.cov.outputs.total }}'
          floor='${{ steps.cov.outputs.floor }}'
          # Bump floor by 1 if total >= floor + 3.
          want=$(awk -v t="$total" -v f="$floor" 'BEGIN { if (t+0 >= f+0 + 3) { print f+1 } else { print f } }')
          if [ "$want" -gt "$floor" ]; then
            echo "bump=true" >> "$GITHUB_OUTPUT"
            echo "new_floor=${want}" >> "$GITHUB_OUTPUT"
          else
            echo "bump=false" >> "$GITHUB_OUTPUT"
            echo "No bump: ${total}% < ${floor}% + 3"
          fi

      - name: write new floor file
        if: steps.decide.outputs.bump == 'true'
        run: echo '${{ steps.decide.outputs.new_floor }}' > .coverage-floor

      - name: open ratchet PR
        id: pr
        if: steps.decide.outputs.bump == 'true'
        # Tolerated so the fallback below can run. The step failing is not
        # the same as the ratchet having nothing to say, and for ten
        # consecutive weekly runs the difference was invisible: every run
        # measured coverage, decided a bump, wrote the file, then died
        # here with "GitHub Actions is not permitted to create or approve
        # pull requests" and reported nothing anyone saw.
        continue-on-error: true
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: |
            chore(ci): ratchet coverage floor ${{ steps.cov.outputs.floor }} → ${{ steps.decide.outputs.new_floor }}

            Coverage on main is ${{ steps.cov.outputs.total }}%, which is
            at least 3pp above the current floor. The ratchet workflow
            bumps the floor by 1pp (one-way; floor only ever goes up).
          branch: chore/coverage-ratchet
          delete-branch: true
          title: 'chore(ci): ratchet coverage floor ${{ steps.cov.outputs.floor }} → ${{ steps.decide.outputs.new_floor }}'
          body: |
            Auto-generated by `coverage-ratchet.yml`.

            - Total coverage on main: **${{ steps.cov.outputs.total }}%**
            - Old floor: **${{ steps.cov.outputs.floor }}%**
            - New floor: **${{ steps.decide.outputs.new_floor }}%**

            The CI gate in `ci.yml` reads `.coverage-floor`. Merging this
            PR tightens the gate by 1pp.
          add-paths: |
            .coverage-floor

      # Fallback. Opening a PR from Actions requires the repository
      # setting "Allow GitHub Actions to create and approve pull
      # requests" (Settings → Actions → General → Workflow permissions).
      # The permissions: block above cannot grant it — it is a repo-level
      # toggle, and while it is off the ratchet cannot land its own
      # change. Filing an issue keeps the measurement actionable instead
      # of stranding it in a log.
      - name: report ratchet result when the PR could not be opened
        if: steps.decide.outputs.bump == 'true' && steps.pr.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          TOTAL: ${{ steps.cov.outputs.total }}
          OLD_FLOOR: ${{ steps.cov.outputs.floor }}
          NEW_FLOOR: ${{ steps.decide.outputs.new_floor }}
        run: |
          title="chore(ci): ratchet coverage floor ${OLD_FLOOR} → ${NEW_FLOOR}"
          body=$(cat <<EOF
          The weekly coverage ratchet wanted to open a PR and could not.

          - Total coverage on main: **${TOTAL}%**
          - Current floor: **${OLD_FLOOR}%**
          - Proposed floor: **${NEW_FLOOR}%**

          To apply, edit \`.coverage-floor\` to \`${NEW_FLOOR}\`.

          To let the ratchet do this itself, enable **Settings → Actions →
          General → Workflow permissions → "Allow GitHub Actions to create
          and approve pull requests"**. Until then, this issue is the only
          output the ratchet can produce.

          Opened by [\`coverage-ratchet.yml\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}).
          EOF
          )
          # One issue per proposed floor, not one per week.
          existing=$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            echo "Issue #${existing} already tracks this bump."
          else
            gh issue create --title "$title" --body "$body" --label ci || \
              gh issue create --title "$title" --body "$body"
          fi
          echo "::error::Coverage ratchet could not open a PR: GitHub Actions is not permitted to create pull requests in this repo. Enable it in Settings → Actions → General → Workflow permissions. The proposed floor (${NEW_FLOOR}%) has been filed as an issue."
          exit 1
