# plumbline assessing itself, through the composite action it ships.
#
# This is the dogfood run for action.yml: any breakage in the action's
# inputs, outputs, or step ordering fails here before a consumer hits it.
# `version: source` builds the CLI from the commit under test, so the
# badge this gate compares against is generated by the same code a
# contributor runs locally.
#
# Note the division of labor with ci.yml: the .plumbline.toon drift gate
# there catches *any* movement in the assessment and surfaces it as a
# reviewable diff. The fail-below floor here is the catastrophe detector
# underneath it — the same soft-floor / hard-floor split the coverage
# gates use.
name: ACMM maturity

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: maturity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plumbline:
    name: ACMM assessment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - id: acmm
        uses: ./
        with:
          version: source
          fail-below: '4'
          badge: .plumbline-badge.svg
          badge-drift-check: 'true'

      - name: report
        run: |
          echo "Assessed L${{ steps.acmm.outputs.level }} — ${{ steps.acmm.outputs.level-name }}"
          echo "Next gap: ${{ steps.acmm.outputs.next-gap }}"
